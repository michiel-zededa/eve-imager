name: Publish release v2.0.0

# TEMPORARY one-shot workflow. Creates the v2.0.0 tag + GitHub release from
# main and then starts the normal "Build release binaries" workflow for it,
# which builds the four binaries and attaches them to the release.
#
# Why this exists: the automation token cannot create a release or dispatch a
# workflow through the API, and a release created by a workflow token does not
# fire the `release: published` trigger. A workflow token may, however, start
# another workflow with workflow_dispatch. Triggered by pushing the
# ci/release-v2.0.0 branch; delete the branch once the release has its assets.

on:
  push:
    branches:
      - ci/release-v2.0.0

permissions:
  contents: write
  actions: write

env:
  TAG: v2.0.0
  TARGET_SHA: f76196e0fe7d90816a5f7485d3d64bce0bb50476

jobs:
  publish:
    name: Create release and start the build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Create release ${{ env.TAG }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists - reusing it."
            exit 0
          fi
          cat > notes.md <<'NOTES'
          ## A new look

          EVE Imager now follows the ZEDEDA product style: a light grey page, white cards, one purple accent, status pills and the Inter typeface.

          ![EVE Imager 2.0](https://github.com/michiel-zededa/eve-imager/blob/v2.0.0/doc/screenshots/version.png?raw=true)

          - **Dark appearance.** The app follows the system setting. The button at the top right switches between system, light and dark, and the choice is remembered.
          - **Version.** The four selectors sit in one card; below them you see the file that will be downloaded, its size and the drive size it needs.
          - **Storage.** Drives that are too small or read-only are marked with a status pill and cannot be selected.
          - **Configuration.** One card per section: controller, networking, WiFi, installation.
          - **Write.** The summary of image, storage and configuration stays visible while writing. The progress card shows the percentage, the amount written and the stage (write, verify, finish).
          - **Done.** Shows what was written and offers **Write another**.
          - **New app icon** on macOS, Windows and Linux.

          ## Also

          - The Done page no longer shows a leftover "Device" row from Raspberry Pi Imager.
          - README: screenshots, updated usage, and corrected build-from-source instructions (Qt 6.9 or newer, `cmake -S src`).

          ## Notes

          - No change to how images are downloaded, written, verified or configured compared with v1.2.2.
          - macOS caches app icons, so the old icon can show in the Dock until the Dock restarts.
          - The binaries are unsigned; see the README for how to open them on macOS and Windows, and for the Linux AppImage prerequisites.
          NOTES
          gh release create "$TAG" \
            --target "$TARGET_SHA" \
            --title "EVE Imager $TAG" \
            --notes-file notes.md \
            --generate-notes

      - name: Start "Build release binaries" for ${{ env.TAG }}
        run: |
          gh workflow run release-build.yml --ref main -f tag="$TAG"
          echo "Dispatched release-build.yml for $TAG"
